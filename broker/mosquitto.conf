# TCP is for hardware and the server-side MQTT mirror. WebSocket is exposed
# through Coolify's HTTPS proxy at wss://bag.versecraft.cn/mqtt.
listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
password_file /mosquitto/config/password_file
acl_file /mosquitto/config/aclfile

persistence true
persistence_location /mosquitto/data/

log_dest stdout
connection_messages true
